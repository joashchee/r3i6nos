# Manifest for scripts/build-runtimes.sh (sourced by bash). Adventure Game Studio 3.6 engine for Linux (Artistic License 2.0) from PortMaster's runtime:
# one aarch64 executable with SDL2 built in (it needs only libc and libstdc++).
NAME=ags
PKG=r3i6nos-runtime-ags
VERSION=3.6
CMD=r3i6nos-run-ags
SRC_FILE=ags_3.6.aarch64.squashfs
SRC_URL=https://raw.githubusercontent.com/PortsMaster/PortMaster-New/16a1a4b7d3712ec59558d3281c0108abf370c24b/runtimes/ags_3.6.aarch64.squashfs
SRC_SHA256=e218ee2eb134bac03adebf4e87e64e93af3c0138a53e7e38cc5a4a96798295e0
ENTRY_ELF="ags_3.6.aarch64"
LICENSE_SPDX="Artistic-2.0"
LICENSE_FILES=""
SOURCE_URL=https://github.com/adventuregamestudio/ags
DEPENDS="libc6, libstdc++6"
DESC="Adventure Game Studio 3.6 engine (Artistic-2.0), pre-extracted, for r3i6nos
 Run an adventure game with r3i6nos-run-ags <game folder or ac2game.dat or .exe>. A game is the person's own copy or a freeware one."
