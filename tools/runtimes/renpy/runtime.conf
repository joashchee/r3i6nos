# Manifest for scripts/build-runtimes.sh (sourced by bash). Ren'Py 8.3.4 (MIT, with LGPL and zlib parts: renpy/LICENSE.txt) from PortMaster's runtime.
NAME=renpy
PKG=r3i6nos-runtime-renpy
VERSION=8.3.4
CMD=r3i6nos-run-renpy
SRC_FILE=renpy_8.3.4.aarch64.squashfs
SRC_URL=https://raw.githubusercontent.com/PortsMaster/PortMaster-New/16a1a4b7d3712ec59558d3281c0108abf370c24b/runtimes/renpy_8.3.4.aarch64.squashfs
SRC_SHA256=d4f7263971c1565382b0fce031a628a9bc0de702076ee6f95efd1130ee144f2d
DROP="lib/python3.9"                  # 12 MB the py3 launcher never reads (it uses lib/py3-linux-aarch64 and lib/python3.12); checked by the test's compile run
ENTRY_ELF="lib/py3-linux-aarch64/python"
LICENSE_SPDX="MIT AND LGPL-2.1-or-later AND Zlib"
LICENSE_FILES="renpy/LICENSE.txt"
SOURCE_URL=https://github.com/renpy/renpy
DEPENDS="libsdl2-2.0-0, libsdl2-image-2.0-0, libfreetype6, libasound2"
DESC="Ren'Py 8.3.4, a visual novel engine (MIT), pre-extracted, for r3i6nos
 Run a game with r3i6nos-run-renpy <folder that holds game/>. Uses the system's SDL2."
