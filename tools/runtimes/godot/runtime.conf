# Manifest for scripts/build-runtimes.sh (sourced by bash). Godot 3.6 as PortMaster's FRT build (MIT: FRT, and Godot's own MIT licence): one aarch64
# executable that plays exported .pck games, linked to the system's SDL2 and zlib.
NAME=godot
PKG=r3i6nos-runtime-godot
VERSION=3.6
CMD=r3i6nos-run-godot
SRC_FILE=frt_3.6.aarch64.squashfs
SRC_URL=https://raw.githubusercontent.com/PortsMaster/PortMaster-New/16a1a4b7d3712ec59558d3281c0108abf370c24b/runtimes/frt_3.6.aarch64.squashfs
SRC_SHA256=0907fdda3d78bad97b69ad9fe5084d016a8525a778bd382dd9a9db0f873e493e
ENTRY_ELF="frt_3.6"
LICENSE_SPDX="MIT"
LICENSE_FILES=""
SOURCE_URL=https://github.com/efornara/frt
DEPENDS="libsdl2-2.0-0, zlib1g"
DESC="Godot 3.6 player (FRT, MIT), pre-extracted, for r3i6nos
 Run an exported game with r3i6nos-run-godot <game.pck or a folder that holds one>. Godot 3 draws with OpenGL ES 2."
