# Manifest for scripts/build-runtimes.sh (sourced by bash). Pyxel (MIT) from PortMaster's runtime, trimmed to the wheel: the image's own Python 3.11 runs it.
NAME=pyxel
PKG=r3i6nos-runtime-pyxel
VERSION=2.2.8                         # the version PortMaster's own test ports use (the gist's CFW guide); newer ones are in docs/RUNTIMES.md
CMD=r3i6nos-run-pyxel
SRC_FILE=pyxel_2.2.8_python_3.11_aarch64.squashfs
SRC_URL=https://raw.githubusercontent.com/PortsMaster/PortMaster-New/16a1a4b7d3712ec59558d3281c0108abf370c24b/runtimes/pyxel_2.2.8_python_3.11_aarch64.squashfs
SRC_SHA256=9d17666211dbfcc73338f0d89e7cdcadda01eaabbd7c06af91df261f50d91210
# Only the wheel is kept (9 MB of 111 MB): the venv's own python3.11 links Debian 11 libraries the image lacks (libssl.so.1.1, libffi.so.7) and the rest is
# maturin, mypy, pyinstaller, pip. "from:to" pairs, to relative to the runtime's folder.
KEEP="lib/python3.11/site-packages/pyxel:site-packages/pyxel lib/python3.11/site-packages/pyxel-2.2.8.dist-info:site-packages/pyxel-2.2.8.dist-info LICENSE.pyxel:LICENSE.pyxel LICENSE.python:LICENSE.python"
ENTRY_ELF="site-packages/pyxel/pyxel_wrapper.abi3.so"   # must be an aarch64 ELF
LICENSE_SPDX="MIT"
LICENSE_FILES="LICENSE.pyxel"
SOURCE_URL=https://github.com/kitao/pyxel
DEPENDS="python3-minimal, libpython3-stdlib, libsdl2-2.0-0"
DESC="Pyxel 2.2.8, a retro game engine for Python (MIT), pre-extracted, for r3i6nos
 Run a game with r3i6nos-run-pyxel <game.py | folder | .pyxapp | .pyxres>. Uses the system's Python 3.11 and SDL2."
