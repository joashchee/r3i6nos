# Pinned sources for scripts/build-streamtools.sh (sourced by bash). Everything fetched is checked against a sha256 here or in lock/*.txt; a mismatch stops the build.
# To move to a newer release: `scripts/build-streamtools.sh --latest` prints the new lines, edit them here, then `scripts/build-streamtools.sh --relock` rewrites lock/*.txt
# (every dependency with its hashes) and `scripts/build-streamtools.sh` rebuilds and tests. docs/STREAM-TOOLS.md, "Updating".

# yt-dlp: the release's single-file zipapp (Unlicense). Its own SHA2-256SUMS names this hash.
YTDLP_VERSION=2026.10.26
YTDLP_URL=https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp
YTDLP_SHA256=e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3

# QuickJS-ng: the JavaScript runtime yt-dlp uses to solve YouTube's challenges (MIT). yt-dlp wants quickjs-ng 0.12 or newer, or QuickJS 2025-04-26 or newer
# (older ones "solve the JS challenges very slowly"); the QuickJS in tools/qjs-node is 2024-01-13, so this is a second, private copy inside the yt-dlp package.
QJS_VERSION=0.18.0
QJS_URL=https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.18.0.tar.gz
QJS_SHA256=28bcd89aa3683fd2a946537e5ce3f11cc46b5cbf3383c7561aaef3df5ff9f1dd

# Python packages (top level; lock/<tool>.txt has the whole resolved set with hashes, made by --relock)
YTDLP_PIP="yt-dlp-ejs pycryptodomex"
GALLERYDL_PIP="gallery-dl==1.32.20"
STREAMLINK_PIP="streamlink==8.6.3"
