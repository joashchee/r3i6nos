name: Build (manual and tags)

# Builds the LÖVE runtimes, the Debian arm64 rootfs, and the SD card image
# (without the board's bootloader and kernel: inject-boot.sh adds those from
# your own card). Manual or on a v* tag only: it takes a while and downloads a
# lot. The fast checks live in ci.yml.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  love:
    # Cross-compiled in a Debian 12 container so it links against Bookworm's
    # libraries, like the rootfs. Cached on the script, so only edits rebuild it.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ["11.5", "12.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache
        with:
          path: build/love/${{ matrix.version }}
          key: love-${{ matrix.version }}-${{ hashFiles('scripts/build_love.sh') }}

      - name: Build LÖVE ${{ matrix.version }} (arm64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm \
            scripts/build_love.sh ${{ matrix.version }}

      # A tar: upload-artifact zips and drops the executable bit.
      - name: Pack
        run: tar -C build/love -cf love-${{ matrix.version }}.tar ${{ matrix.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: love-${{ matrix.version }}-arm64
          path: love-${{ matrix.version }}.tar
          retention-days: 7

  native:
    # The native default apps (apps/*/app.conf with DEFAULT=1), each built by its own reusable workflow, the same one
    # its app-<name>.yml uses, so the firmware only bundles the .deb files and owns no app's build.
    strategy:
      fail-fast: false
      matrix:
        app: [input-checker-native, commander-native]
    uses: ./.github/workflows/native-app.yml
    with:
      app: ${{ matrix.app }}

  loveapps:
    # The LÖVE default apps, each built (checked, tested, packed) by its own reusable workflow, the same one its
    # app-<name>.yml uses; the firmware only bundles the .love files.
    strategy:
      fail-fast: false
      matrix:
        app: [input-checker-love]
    uses: ./.github/workflows/love-app.yml
    with:
      app: ${{ matrix.app }}

  rootfs:
    needs: [love, native, loveapps]
    # Build the rootfs with whatever runtimes were built, so a failing 12.0 does
    # not hide the rest. The run is still red: the love job failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: love-*-arm64
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*-arm64
          path: build/native
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: loveapp-*
          path: build/love-apps
          merge-multiple: true

      - name: Unpack LÖVE
        run: |
          mkdir -p build/love
          for t in love-*.tar; do sudo tar -C build/love -xf "$t"; done
          ls build/love

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring \
            qemu-user-static binfmt-support systemd zstd

      - name: Fetch QuickJS (pinned; the toolchain test builds the sample CLI with it)
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/quickjs-2024-01-13.tar.xz https://bellard.org/quickjs/quickjs-2024-01-13.tar.xz
          echo "3c4bf8f895bfa54beb486c8d1218112771ecfc5ac3be1036851ef41568212e03  vendor/quickjs-2024-01-13.tar.xz" | sha256sum -c -
      - name: Fast checks first
        run: |
          sudo apt-get install -y shellcheck luajit libsdl2-dev
          scripts/check.sh

      - name: Build rootfs
        run: sudo scripts/build_rootfs.sh

      - name: Smoke test LÖVE under qemu
        # Dummy video and audio: proves it links and its non-graphical modules work, not that it draws.
        run: |
          for dir in build/rootfs/opt/love/*/; do
            sudo scripts/smoke_love.sh build/rootfs "$(basename "$dir")"
          done

      - name: Smoke test the native apps under qemu
        # Dummy video: proves the arm64 binaries run against the rootfs's SDL2 (Commander also runs its own file tests
        # in a temporary folder), not that they draw on the panel or see a pad.
        run: |
          D=build/rootfs/opt/loveos/defaults/native_deb
          scripts/smoke_native.sh build/rootfs "$D/Input_Checker_Native.deb" input-checker-native
          scripts/smoke_native.sh build/rootfs "$D/Commander.deb" commander

      - name: Sanity check the tree
        run: |
          set -e
          R=build/rootfs
          sudo test -L $R/etc/systemd/system/multi-user.target.wants/loveos.service
          sudo test -x $R/usr/local/bin/loveos-session
          sudo test -f $R/opt/loveos/menu/main.lua
          # every module the boot scripts import must exist in the rootfs (python3-minimal lacks shutil)
          sudo python3 -I scripts/check_py_imports.py $R overlay/usr/local/bin/deb_watcher.py overlay/usr/local/bin/r3i6nos-net overlay/usr/local/bin/r3i6nos-about overlay/usr/local/bin/r3i6nos-cards overlay/usr/local/bin/r3i6nos-report
          sudo test -x $R/opt/love/11.5/bin/love
          # Settings > About: the build says which commit it is, and HTTPS to GitHub has its certificates
          sudo grep -Eq '^COMMIT=[0-9a-f]{40}$' $R/etc/r3i6nos-release
          sudo test -s $R/etc/ssl/certs/ca-certificates.crt
          sudo test -x $R/usr/local/bin/r3i6nos-about
          # docs/STORAGE.md: the cards are mounted by role with blkid and mount; loveos owns the tools folder deb_watcher writes
          sudo test -x $R/usr/local/bin/r3i6nos-cards
          sudo test -x $R/usr/sbin/blkid -o -x $R/sbin/blkid
          sudo test -x $R/usr/bin/mount -o -x $R/bin/mount
          test "$(sudo stat -c %U $R/opt/loveos/bin)" = loveos
          # the built-in default apps (the input checker three ways)
          sudo test -f "$R/opt/loveos/defaults/Love 11.5/Input_Checker.love"
          sudo test -f "$R/opt/loveos/defaults/Love 12.0/Input_Checker.love"
          sudo test -f "$R/opt/loveos/defaults/native_deb/Input_Checker_Native.deb"
          sudo test -f "$R/opt/loveos/defaults/native_deb/Commander.deb"
          sudo grep -q '^loveos:x:1000:' $R/etc/passwd
          sudo grep -q '^root:!' $R/etc/shadow
          sudo find $R/usr/share/doc -name copyright | head -3
          sudo du -sh $R

      - name: Verify the unit with systemd-analyze
        # --root makes it look for ExecStart inside the rootfs, not on the runner.
        # The host's systemd does the checking, so this is syntax and paths only.
        run: |
          sudo systemd-analyze --root=build/rootfs verify /etc/systemd/system/loveos.service

      - name: Pack
        run: |
          sudo tar --numeric-owner -C build/rootfs -cf - . | zstd -T0 -10 -o r3i6nos-rootfs.tar.zst
          sha256sum r3i6nos-rootfs.tar.zst | tee r3i6nos-rootfs.tar.zst.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: r3i6nos-rootfs
          path: |
            r3i6nos-rootfs.tar.zst
            r3i6nos-rootfs.tar.zst.sha256
          retention-days: 7

  image:
    needs: rootfs
    if: ${{ needs.rootfs.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools e2fsprogs fdisk zstd

      - name: Image script tests (tiny fake image)
        run: sudo bash tests/test_image.sh

      - uses: actions/download-artifact@v8
        with:
          name: r3i6nos-rootfs

      - name: Unpack rootfs
        run: |
          mkdir -p build/rootfs
          zstd -dc r3i6nos-rootfs.tar.zst | sudo tar --numeric-owner -C build/rootfs -xpf -

      - name: Assemble image
        run: sudo scripts/assemble_image.sh

      - name: Check image
        run: sudo scripts/check_image.sh build/r36s-loveos.img

      - name: Compress
        run: |
          sudo gzip -9 build/r36s-loveos.img
          cd build
          sha256sum r36s-loveos.img.gz | sudo tee r36s-loveos.img.gz.sha256
          ls -lh r36s-loveos.img.gz

      - uses: actions/upload-artifact@v7
        with:
          name: r3i6nos-image
          path: |
            build/r36s-loveos.img.gz
            build/r36s-loveos.img.gz.sha256
          retention-days: 7
