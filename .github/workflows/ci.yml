name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets; say so explicitly.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck luajit libsdl2-dev python3-pil alsa-utils xz-utils zstd   # alsa-utils: test_asound_conf.py opens /etc/asound.conf's chain in alsa-lib
      # check.sh's Docker tests run debian:12-slim with --platform linux/arm64 on this x86 runner; without a registered handler they
      # fail with "exec format error" (2026-11-22, and the rootfs job on 2026-11-21), and check.sh then ends with exit 1 under the shellcheck step.
      - name: Register the arm64 binfmt handler
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker run --rm --platform linux/arm64 debian:12-slim uname -m | grep -qx aarch64
      - name: Fetch QuickJS (pinned; the toolchain test builds the sample CLI with it)
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/quickjs-2024-01-13.tar.xz https://bellard.org/quickjs/quickjs-2024-01-13.tar.xz
          echo "3c4bf8f895bfa54beb486c8d1218112771ecfc5ac3be1036851ef41568212e03  vendor/quickjs-2024-01-13.tar.xz" | sha256sum -c -
      - name: Run checks
        run: scripts/check.sh
