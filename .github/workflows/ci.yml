name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets; say so explicitly.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck luajit libsdl2-dev python3-pil
      - name: Run checks
        run: scripts/check.sh
