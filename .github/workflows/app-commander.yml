name: App - Commander

# Commander's own build, apart from the firmware's. Runs when Commander (or what it compiles against) changes,
# by hand, or on a `commander-v*` tag, which also publishes a GitHub release with the .deb. The firmware build
# (build.yml) bundles the same app through the same reusable workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/commander-native/**"
      - "theme/**"
      - "NOTICE"
      - "LICENSE"
      - "scripts/build_native_app.sh"
      - "scripts/smoke_native.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-commander.yml"
    tags: ["commander-v*"]
  pull_request:
    paths:
      - "apps/commander-native/**"
      - "theme/**"
      - "scripts/build_native_app.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-commander.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-app.yml
    with:
      app: commander-native
      # commander-v1.2 -> 1.2; anything else keeps the default
      version: ${{ startsWith(github.ref, 'refs/tags/commander-v') && github.ref_name || '1.0' }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/commander-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Commander.deb | tee Commander.deb.sha256
          gh release create "${{ github.ref_name }}" Commander.deb Commander.deb.sha256 \
            --repo "${{ github.repository }}" --title "Commander ${{ github.ref_name }}" \
            --notes "Commander for the R36S as an arm64 .deb: drop it in \`native_deb/\` on the games card. Not run on a real R36S yet."
