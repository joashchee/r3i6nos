name: App - Font Editor

# Font Editor's own build, apart from the firmware's (it is not a default app: the .deb goes in native_deb/). Runs when it (or what it compiles against) changes,
# by hand, or on a `fontedit-v*` tag, which also publishes a GitHub release with the .deb.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/fontedit-native/**"
      - "theme/**"
      - "NOTICE"
      - "LICENSE"
      - "scripts/build_native_app.sh"
      - "scripts/smoke_native.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-fontedit.yml"
    tags: ["fontedit-v*"]
  pull_request:
    paths:
      - "apps/fontedit-native/**"
      - "theme/**"
      - "scripts/build_native_app.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-fontedit.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-app.yml
    with:
      app: fontedit-native
      # fontedit-v0.2 -> 0.2; anything else keeps the default
      version: ${{ startsWith(github.ref, 'refs/tags/fontedit-v') && github.ref_name || '0.1' }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/fontedit-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Font_Editor.deb | tee Font_Editor.deb.sha256
          gh release create "${{ github.ref_name }}" Font_Editor.deb Font_Editor.deb.sha256 \
            --repo "${{ github.repository }}" --title "Font Editor ${{ github.ref_name }}" \
            --notes "Font Editor for the R36S as an arm64 .deb: drop it in \`native_deb/\` on the games card. Not run on a real R36S yet."
