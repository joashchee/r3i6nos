name: App - Input Checker (native)

# The native input checker's own build, apart from the firmware's. Runs when the input checker changes,
# by hand, or on a `input-checker-native-v*` tag, which also publishes a GitHub release with the .deb. The firmware build
# (build.yml) bundles the same app through the same reusable workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/input-checker-native/**"
      - "LICENSE"
      - "scripts/build_native_app.sh"
      - "scripts/smoke_native.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-input-checker-native.yml"
    tags: ["input-checker-native-v*"]
  pull_request:
    paths:
      - "apps/input-checker-native/**"
      - "scripts/build_native_app.sh"
      - ".github/workflows/native-app.yml"
      - ".github/workflows/app-input-checker-native.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-app.yml
    with:
      app: input-checker-native
      # input-checker-native-v1.2 -> 1.2; anything else keeps the default
      version: ${{ startsWith(github.ref, 'refs/tags/input-checker-native-v') && github.ref_name || '1.0' }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/input-checker-native-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Input_Checker_Native.deb | tee Input_Checker_Native.deb.sha256
          gh release create "${{ github.ref_name }}" Input_Checker_Native.deb Input_Checker_Native.deb.sha256 \
            --repo "${{ github.repository }}" --title "Input Checker (native) ${{ github.ref_name }}" \
            --notes "The native R36S input checker as an arm64 .deb: drop it in \`native_deb/\` on the games card. Not run on a real R36S yet."
