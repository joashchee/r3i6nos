<style>

  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 16px/1.4 monospace; }
  #screen { image-rendering: pixelated; width: 512px; height: 384px; max-width: 100vw; max-height: calc(100vh - 3em); }

var cells = new Uint8Array(COLS * ROWS * 2);
var cv = document.getElementById("screen"), ctx = cv.getContext("2d"), stateEl = document.getElementById("state");
var img = ctx.createImageData(W, H);

function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

function paint(i) {                    // cell i, from its character and attribute
  var ch = cells[2 * i], at = cells[2 * i + 1], fg = RGB[at & 15], bg = RGB[at >> 4], d = img.data;
  for (var y = 0; y < H; y++) {
    var bits = FONT[ch * H + y];
    for (var x = 0; x < W; x++) {
      var c = (bits >> (7 - x)) & 1 ? fg : bg, o = (y * W + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, (i % COLS) * W, Math.floor(i / COLS) * H);
}

function full(bytes) { cells.set(bytes.subarray(0, cells.length)); for (var i = 0; i < COLS * ROWS; i++) paint(i); }

function delta(b) {                    // runs of (u16 start, u8 count, count x 2 bytes)
  var i = 0;
  while (i + 3 <= b.length) {
    var start = (b[i] << 8) | b[i + 1], count = b[i + 2]; i += 3;
    if (count === 0 || i + count * 2 > b.length || start + count > COLS * ROWS) return;
    for (var k = 0; k < count; k++) { cells[2 * (start + k)] = b[i++]; cells[2 * (start + k) + 1] = b[i++]; paint(start + k); }
  }
}

var es = new EventSource("cells");     // reconnects by itself; the unit sends the whole screen again each time
es.addEventListener("full", function (e) { full(b64(e.data)); stateEl.textContent = ""; });
es.addEventListener("delta", function (e) { delta(b64(e.data)); });
es.onerror = function () { stateEl.textContent = "Waiting for the unit…"; };
