# r3i6nos: every app's sound goes through two software volumes on card 0 (docs/SOUND.md).
# The RK817 codec's driver has no volume control of its own (its DAC level is fixed by the device tree, about -1 dB), so:
#   Volume  -40 to 0 dB in 2 dB steps: the volume keys and Settings > Sound mixer
#   Boost   0 to +18 dB in 3 dB steps (step 1 is 0 dB): makes quiet sound louder; it clips sound that is already loud
# alsa-lib refuses a softvol whose min_dB is not negative ("min_dB must be a negative value", and then NO program can open the
# default device: every app was silent with "Couldn't open audio device", 2026-11-10), and a softvol's step 0 is silence. So Boost
# runs from -3 dB: its step 0 (silence) is never used (r3i6nos-sound and the mixer stop at step 1, exactly 0 dB, passed through as is).
# ALSA makes both controls when a program first opens "default"; r3i6nos-sound does that at boot and restores their levels.

pcm.!default {
    type plug
    slave.pcm "r3i6nos_volume"
}

pcm.r3i6nos_volume {
    type softvol
    slave.pcm "r3i6nos_boost"
    control { name "Volume" card 0 }
    min_dB -40.0
    max_dB 0.0
    resolution 21
}

pcm.r3i6nos_boost {
    type softvol
    slave.pcm "hw:0,0"
    control { name "Boost" card 0 }
    min_dB -3.0
    max_dB 18.0
    resolution 8
}

ctl.!default {
    type hw
    card 0
}
