# r3i6nos: every app's sound goes through two software volumes on card 0 (docs/SOUND.md).
# The RK817 codec's driver has no volume control of its own (its DAC level is fixed by the device tree, about -1 dB), so:
#   Volume  -40 to 0 dB in 2 dB steps: the volume keys and Settings > Sound mixer
#   Boost   0 to +18 dB in 3 dB steps: makes quiet sound louder; it clips sound that is already loud
# ALSA makes both controls when a program first opens "default"; r3i6nos-sound does that at boot and restores their levels.

pcm.!default {
    type plug
    slave.pcm "r3i6nos_volume"
}

pcm.r3i6nos_volume {
    type softvol
    slave.pcm "r3i6nos_boost"
    control { name "Volume" card 0 }
    min_dB -40.0
    max_dB 0.0
    resolution 21
}

pcm.r3i6nos_boost {
    type softvol
    slave.pcm "hw:0,0"
    control { name "Boost" card 0 }
    min_dB 0.0
    max_dB 18.0
    resolution 7
}

ctl.!default {
    type hw
    card 0
}
