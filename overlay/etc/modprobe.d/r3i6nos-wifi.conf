# Two drivers in the 4.4.189 kernel claim the Realtek RTL8188EUS dongle (USB 0bda:8179 and 0bda:0179, product "802.11n NIC"):
# the Rockchip vendor driver 8188eu (cfg80211, so `iw` and Settings > Network can scan with it) and the staging r8188eu
# (wireless extensions only: its wlan0 answers `iw dev wlan0 scan` with "No such device (-19)"). udev loaded both and the
# staging one could win. Never load the staging one by alias; the vendor driver does the work.
blacklist r8188eu
