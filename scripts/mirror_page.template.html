<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>r3i6nos screen</title>
<!--
  The screen of an r3i6nos handheld, painted from its text cells. Read-only: this page sends nothing to the unit.
  Font: "WebPlus IBM VGA 8x16" from The Ultimate Oldschool PC Font Pack v2.2, (c) 2016-2020 VileR,
  https://int10h.org/oldschool-pc-fonts/ , licensed under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
  CHANGES: rasterised at 16 px to 1-bit 8x16 bitmaps (r3i6nos, 2026) and embedded below as base64. This page is that adaptation and
  is licensed under CC BY-SA 4.0, not under the repository's MIT licence. Provided as is, without warranties.
-->
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #aaa; --hint: #55ffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 16px/1.4 monospace; }
  #screen { image-rendering: pixelated; width: 512px; height: 384px; max-width: 100vw; max-height: calc(100vh - 3em); }
  #state { min-height: 1.4em; padding: .3em 16px; color: var(--hint); }
  #credit { position: fixed; right: 8px; bottom: 4px; font-size: 11px; opacity: .7; }
  #credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="screen" width="512" height="384" role="img" aria-label="The unit's screen, shown as text"></canvas>
<div id="state" role="status" aria-live="polite">Connecting…</div>
<div id="credit">Font: IBM VGA 8x16 by <a href="https://int10h.org/oldschool-pc-fonts/">VileR</a>, CC BY-SA 4.0</div>
<script>
"use strict";
var COLS = 64, ROWS = 24, W = 8, H = 16;
var RGB = [[0,0,0],[0,0,170],[0,170,0],[0,170,170],[170,0,0],[170,0,170],[170,85,0],[170,170,170],
           [85,85,85],[85,85,255],[85,255,85],[85,255,255],[255,85,85],[255,85,255],[255,255,85],[255,255,255]];
var FONT = b64("@FONT@");              // 256 characters x 16 rows, the top bit the leftmost pixel
var cells = new Uint8Array(COLS * ROWS * 2);
var cv = document.getElementById("screen"), ctx = cv.getContext("2d"), stateEl = document.getElementById("state");
var img = ctx.createImageData(W, H);

function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

function paint(i) {                    // cell i, from its character and attribute
  var ch = cells[2 * i], at = cells[2 * i + 1], fg = RGB[at & 15], bg = RGB[at >> 4], d = img.data;
  for (var y = 0; y < H; y++) {
    var bits = FONT[ch * H + y];
    for (var x = 0; x < W; x++) {
      var c = (bits >> (7 - x)) & 1 ? fg : bg, o = (y * W + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, (i % COLS) * W, Math.floor(i / COLS) * H);
}

function full(bytes) { cells.set(bytes.subarray(0, cells.length)); for (var i = 0; i < COLS * ROWS; i++) paint(i); }

function delta(b) {                    // runs of (u16 start, u8 count, count x 2 bytes)
  var i = 0;
  while (i + 3 <= b.length) {
    var start = (b[i] << 8) | b[i + 1], count = b[i + 2]; i += 3;
    if (count === 0 || i + count * 2 > b.length || start + count > COLS * ROWS) return;
    for (var k = 0; k < count; k++) { cells[2 * (start + k)] = b[i++]; cells[2 * (start + k) + 1] = b[i++]; paint(start + k); }
  }
}

var es = new EventSource("cells");     // reconnects by itself; the unit sends the whole screen again each time
es.addEventListener("full", function (e) { full(b64(e.data)); stateEl.textContent = ""; });
es.addEventListener("delta", function (e) { delta(b64(e.data)); });
es.onerror = function () { stateEl.textContent = "Waiting for the unit…"; };
</script>
</body>
</html>
