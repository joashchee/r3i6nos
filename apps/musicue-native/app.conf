# Build manifest for scripts/build_native_app.sh (sourced by bash). One per native app.
NAME=MusiCue                          # the .deb's file name, and the app's name in the menu
BIN=musicue                           # usr/games/<BIN>
PKG=r36s-musicue                      # Debian package name
SRC=musicue.c                         # in this folder
THEME=1                               # compile against theme/ (ships the font's CC BY-SA credit in the deb)
DEFAULT=0                             # a user-installed package (native_deb/), not part of the firmware image
DATA_DIR=MusiCue                      # the app's data folder on a card (CLAUDE.md rule 16, docs/APP-DATA.md)
RENDER_HELPER=1                       # builds tools/stretch-proto/musicue_render.cpp into usr/lib/musicue/musicue-render (scripts/build_native_app.sh)
EXTRA_FILES="musicue-sync:usr/lib/musicue/musicue-sync:755"   # src (in this folder):dest (in the package):mode, space separated
DESC="MusiCue: markers and cues on the songs you have (native ARM64, SDL2)
 The R36S port of Cue. The whole song as one waveform with a moving playhead, jump markers and
 synced cues from Cue's own files, instant jumps and gapless A/B loops, on the r3i6nos-ansiapps
 text-mode theme in true colour. Plays your own audio files; an optional sync fetches Cue's
 cue files and, with the yt-dlp package, Creative Commons audio."
