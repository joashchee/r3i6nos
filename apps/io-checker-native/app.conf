# Build manifest for scripts/build_native_app.sh (sourced by bash). One per native app.
NAME=IO_Checker_Native                # the .deb's file name, and the app's name in the menu
BIN=io-checker-native                 # usr/games/<BIN>
PKG=r36s-io-checker-native            # Debian package name
SRC=io_checker.c                      # in this folder
THEME=1                               # compile against theme/ (ships the font's CC BY-SA credit in the deb)
DEFAULT=1                             # built into the firmware image (scripts/build_native_apps.sh)
DESC="IO Checker: input and output checks for the R36S (native ARM64, SDL2)
 Every button, stick, the D-pad and the power and volume keys; test patterns and a measured frame
 rate; test tones you mark heard or silent; file checks on both cards; what the OTG port
 brings (USB devices, video out, MIDI, storage, Ethernet, keyboard, mouse, game controllers); and a
 device report for the maintainer. Built into r3i6nos as a default app."
