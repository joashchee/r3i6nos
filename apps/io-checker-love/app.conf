# Build manifest for scripts/build_love_app.sh (sourced by bash). One per LÖVE app.
TYPE=love
NAME=IO_Checker                      # the .love's file name, and the app's name in the menu
RUNTIMES="11.5 12.0"                 # one copy per LÖVE version, in "Love <version>/"
TESTS=tests/test_io_checker.lua      # run with luajit from the repo root before packing (optional)
DEFAULT=0                            # not in the firmware image (only native .deb apps are; the card or a Mac can run it)
