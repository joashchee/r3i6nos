# Build manifest for scripts/build_native_app.sh (sourced by bash). One per native app.
NAME=Input_Checker_Native
BIN=input-checker-native
PKG=r36s-input-checker-native
SRC=input_checker.c
THEME=0
DEFAULT=1
DESC="R36S input checker (native ARM64, SDL2)
 Shows every button, axis and the D-pad of the handheld's gamepad as SDL reports them, so
 the real layout of a unit can be read off the screen. Built into r3i6nos as a default app."
