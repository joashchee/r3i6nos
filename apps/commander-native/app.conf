# Build manifest for scripts/build_native_app.sh (sourced by bash). One per native app.
NAME=Commander                       # the .deb's file name, and the app's name in the menu
BIN=commander                        # usr/games/<BIN>
PKG=r36s-commander                   # Debian package name
SRC=commander.c                      # in this folder
THEME=1                              # compile against theme/ (ships the font's CC BY-SA credit in the deb)
DEFAULT=1                            # built into the firmware image (scripts/build_native_apps.sh)
DESC="Commander: a two-panel file manager (native ARM64, SDL2)
 Browse, view, copy, move, rename, make folders and delete, in the r3i6nos-ansiapps text-mode
 theme, with the R36S's buttons. Built into r3i6nos as a default app."
