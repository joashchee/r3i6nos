# Build manifest for scripts/build_love_app.sh (sourced by bash). One per LÖVE app.
TYPE=love
NAME=Input_Checker                   # the .love's file name, and the app's name in the menu
RUNTIMES="11.5 12.0"                 # one copy per LÖVE version, in "Love <version>/"
TESTS=tests/test_input_checker.lua   # run with luajit from the repo root before packing (optional)
DEFAULT=1                            # built into the firmware image
