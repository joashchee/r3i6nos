# Build manifest for scripts/build_native_app.sh (sourced by bash). One per native app.
NAME=Font_Editor                      # the .deb's file name, and the app's name in the menu
BIN=fontedit                          # usr/games/<BIN>
PKG=r36s-fontedit                     # Debian package name
SRC=fontedit.c                        # in this folder
THEME=1                               # compile against theme/ (ships the font's credit and licence in the deb)
DATA_DIR=FontEdit                     # the app's data folder on a card (CLAUDE.md rule 16, docs/APP-DATA.md)
DESC="Font Editor: a bitmap font editor for the R36S (native ARM64, SDL2)
 Touches up ANSIapps Mono, the font of every r3i6nos app, and other monospace bitmap (BDF) fonts,
 with its multi-cell glyphs (two-cell icons, key caps, shoulders, sticks, knobs) first: a pair is
 drawn on one canvas, across the seam between its cells. Drawn with the pad: pen, line, box,
 fill, undo and redo, flips, shifts and mirrors. Not built into the image: drop the .deb in native_deb/."
