# Build manifest for scripts/build-portmaster.sh (sourced by bash). PortMaster is a third-party app (MIT): its release zip is fetched, checked
# against the pinned hash, trimmed to arm64 and packed with this folder's launcher and hooks as build/native/PortMaster.deb.
TYPE=bundle                          # not native (no C here), not a LÖVE app: scripts/build_native_apps.sh and build_love_app.sh skip it
NAME=PortMaster                      # the .deb's file name, and the app's name in the menu
BIN=portmaster                       # usr/games/<BIN>
PKG=r36s-portmaster                  # Debian package name
DEFAULT=1                            # built into the firmware image, for testing (docs/PORTMASTER.md)
PM_VERSION=2026.11.17-0700           # PortMaster-GUI release tag
PM_URL=https://github.com/PortsMaster/PortMaster-GUI/releases/download/2026.11.17-0700/PortMaster.zip
PM_SHA256=d96a921ed3110f3c1b56b1f5b88d34539241723bd2fb003f29edbce5402a4fef
DESC="PortMaster: a curated catalog of game ports (third-party, MIT; for testing)
 Downloads ports and runtimes only when a person opens it and chooses to (it needs a network);
 ports that need the game's own files need the person's copy. Built into r3i6nos for testing."
